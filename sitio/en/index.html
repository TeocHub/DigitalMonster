<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Monster | Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="nav-minimal">
        <div class="logo-text">DIGITAL MONSTER</div>

            <div class="links">

                <span data-key="hero_1">WE CREATE</span> <br> 
                <span class="outline" data-key="hero_2">MONSTERS</span>
            </h1>
        </div>

    <section id="projects" class="work-section">

                <div class="work-status" data-key="status_soon">COMING SOON</div>
            </div>
        </div>
        
        <div class="work-item">
            <div class="work-info">
                <span class="work-num">01</span>

            </div>
            <div class="work-preview">
                <img src="/assets/MOBA/coming_soon.png" alt="MOBA" class="floating-art">
                <div class="work-status" data-key="status_soon">COMING SOON</div>
            </div>
        </div>

    <footer class="glitch-footer">
        <div class="social-links">
            <a href="https://www.instagram.com/digimonsterslab/"><img src="/assets/rrss/Instagram_White.svg"></a>
            <a href="https://x.com/DigiMonstersLab"><img src="/assets/rrss/Twitter_White.svg"></a>
            <a href="https://bsky.app/profile/digimonsterslab.bsky.social"><img src="/assets/rrss/Blusky_White.svg"></a>
            <a href="https://www.whatsapp.com/channel/0029VayEK3GGufItEz7sJK16"><img src="/assets/rrss/Whatsapp_White.svg"></a>
        </div>
        <p>© 2025 DIGITAL MONSTER — <span data-key="footer_text">CREATIVE STUDIO</span></p>
